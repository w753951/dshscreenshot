name: Build apphook (in-process UI tap)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/apphook/**'
      - '.github/workflows/build-apphook.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xz-utils curl libtinfo5 libncurses5

      - name: toolchain
        run: |
          set -e
          curl -L -o tc.tar.lzma https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p $HOME/tc && tar xf tc.tar.lzma -C $HOME/tc
          $HOME/tc/ios-arm64e-clang-toolchain/bin/clang --version | head -2

      - name: sdk
        run: |
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip

      - name: compile
        run: |
          set -e
          C=$HOME/tc/ios-arm64e-clang-toolchain/bin/clang
          SDK=$PWD/sdks-master/iPhoneOS13.7.sdk
          [ -d "$SDK" ] || SDK=$(ls -d $PWD/sdks-master/iPhoneOS*.sdk | sort -V | head -1)
          mkdir -p out
          for ARCH in arm64 arm64e; do
            $C -target ${ARCH}-apple-ios15.0 -isysroot "$SDK" \
              -dynamiclib -O2 -fobjc-arc -fblocks -DNDEBUG \
              -framework Foundation -framework UIKit \
              -install_name /Library/MobileSubstrate/DynamicLibraries/DshAppHook.dylib \
              -o out/DshAppHook.$ARCH.dylib src/apphook/apphook.m && echo "$ARCH OK" || echo "$ARCH FAILED"
          done
          ls -la out/
          for f in out/*.dylib; do echo "$f:"; od -An -tx4 -N 12 $f; done
          echo "=== pacibsp 统计（arm64e 应 >0，arm64 应 0）==="
          for f in out/*.dylib; do printf "%s: " "$f"; od -An -v -tx1 $f | tr -s ' \n' '\n' | grep -v '^$' | paste -d' ' - - - - | grep -c "7f 23 03 d5" || true; done

      - uses: actions/upload-artifact@v4
        with:
          name: apphook
          path: out/
          retention-days: 7

      - name: publish dist (arm64 slice — 这台机 libhooker 只吃无 PAC 的 arm64)
        run: |
          set -e
          mkdir -p dist
          cp out/DshAppHook.arm64.dylib dist/DshAppHook.arm64.dylib
          cp out/DshAppHook.arm64e.dylib dist/DshAppHook.arm64e.dylib
          cp src/apphook/apphook.m dist/apphook.m
          git config user.name "dsh-bot"
          git config user.email "bot@dsh.local"
          git add -f dist
          git commit -m "dist: apphook arm64+arm64e build $(date -u +%Y%m%d%H%M%S)" || true
          git push
