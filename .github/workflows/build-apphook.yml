name: build-dshauto

on:
  workflow_dispatch:
  push:
    paths:
      - 'DshAuto/DshAuto.m'
      - '.github/workflows/build-dshauto.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y wget unzip xz-utils curl libtinfo5 libncurses5

      - name: 工具链（sbingner arm64e clang-10）
        run: |
          URL=https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          curl -L -o tc.tar.lzma "$URL"
          mkdir -p "$HOME/tc" && tar xf tc.tar.lzma -C "$HOME/tc"

      - name: iOS 13.7 SDK（必须，新 SDK 的 tbd clang-10 不认）
        run: |
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip

      - name: 编译 arm64e
        run: |
          C="$HOME/tc/ios-arm64e-clang-toolchain/bin/clang"
          SDK="$PWD/sdks-master/iPhoneOS13.7.sdk"
          mkdir -p out
          "$C" -target arm64e-apple-ios15.0 -isysroot "$SDK" \
             -dynamiclib -O2 -fobjc-arc -fblocks -DNDEBUG \
             -framework Foundation -framework UIKit -framework CoreGraphics \
             -install_name /Library/MobileSubstrate/DynamicLibraries/DshAuto.dylib \
             -o out/DshAuto.dylib DshAuto/DshAuto.m
          # 设备要求 cpusubtype = 0x80000002（arm64e + PAC ABI v2）
          printf '\x02\x00\x00\x80' | dd of=out/DshAuto.dylib bs=1 seek=8 conv=notrunc
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: DshAuto.dylib
          path: out/DshAuto.dylib
