name: Build DshScreenshotService

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 19 (arm64e-aware lld) + tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg lsb-release software-properties-common zip
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19 lld-19 llvm-19
          clang-19 --version
          ld64.lld-19 --version || true
          ls /usr/lib/llvm-19/bin/ | grep -i -E "lld|lipo" || true

      - name: Fetch iOS SDK
        run: |
          set -e
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip
          ls sdks-master | head
          echo "SDK_ROOT=$PWD/sdks-master" >> $GITHUB_ENV

      - name: Compile arm64 + arm64e
        run: |
          set -e
          SDK="$SDK_ROOT/iPhoneOS15.6.sdk"
          [ -d "$SDK" ] || SDK=$(ls -d $SDK_ROOT/iPhoneOS*.sdk | tail -1)
          echo "SDK=$SDK"
          CLANG=/usr/lib/llvm-19/bin/clang
          LLD=/usr/lib/llvm-19/bin/ld64.lld
          ls -la $LLD || LLD=/usr/lib/llvm-19/bin/ld.lld
          mkdir -p out
          for ARCH in arm64 arm64e; do
            echo "=== $ARCH ==="
            EXTRA=""
            if [ "$ARCH" = "arm64e" ]; then
              EXTRA="-fptrauth-calls -fptrauth-returns -fptrauth-indirect-gotos -fptrauth-auth-traps -fptrauth-vtable-pointer-address-discrimination -fptrauth-vtable-pointer-type-discrimination"
            fi
            $CLANG -target ${ARCH}-apple-ios14.0 \
              -isysroot "$SDK" \
              -fuse-ld="$LLD" \
              -dynamiclib \
              -fobjc-arc -O2 -fblocks $EXTRA \
              -DNDEBUG \
              -framework Foundation -framework UIKit \
              -framework CoreGraphics -framework IOSurface \
              -framework ImageIO -framework QuartzCore \
              -install_name /Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib \
              -Wl,-platform_version,ios,14.0,15.6 \
              -Wl,-arch,$ARCH \
              -o out/DshScreenshotService.$ARCH.dylib \
              src/DshScreenshotService.m
            echo "$ARCH OK"
          done
          ls -la out/

      - name: Lipo (manual fat assembly)
        run: |
          set -e
          A=out/DshScreenshotService.arm64.dylib
          E=out/DshScreenshotService.arm64e.dylib
          ls -la $A $E
          echo "arm64  cpu:"; od -An -tx4 -N 12 $A
          echo "arm64e cpu:"; od -An -tx4 -N 12 $E
          node -e '
            const fs=require("fs");
            const a=fs.readFileSync("out/DshScreenshotService.arm64.dylib");
            const e=fs.readFileSync("out/DshScreenshotService.arm64e.dylib");
            const ALIGN=0x4000;
            const pad=(n)=>(ALIGN-(n%ALIGN))%ALIGN;
            const hdrLen=8+2*20;
            const offA=hdrLen+pad(hdrLen);
            const offE=offA+a.length+pad(a.length);
            const total=offE+e.length;
            const buf=Buffer.alloc(total);
            buf.writeUInt32BE(0xcafebabe,0);
            buf.writeUInt32BE(2,4);
            // arch 0: arm64  cputype=0x0100000c subtype=0
            buf.writeUInt32BE(0x0100000c,8);
            buf.writeUInt32BE(0,12);
            buf.writeUInt32BE(offA,16);
            buf.writeUInt32BE(a.length,20);
            buf.writeUInt32BE(14,24);
            // arch 1: arm64e cputype=0x0100000c subtype=0x80000002
            buf.writeUInt32BE(0x0100000c,28);
            buf.writeUInt32BE(0x80000002,32);
            buf.writeUInt32BE(offE,36);
            buf.writeUInt32BE(e.length,40);
            buf.writeUInt32BE(14,44);
            a.copy(buf,offA);
            e.copy(buf,offE);
            fs.writeFileSync("out/DshScreenshotService.dylib",buf);
            console.log("fat built", total, "bytes; offA="+offA+" offE="+offE);
          '
          od -An -tx4 -N 52 out/DshScreenshotService.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: DshScreenshotService
          path: out/
          retention-days: 7
