name: Build DshScreenshotService

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 19 (arm64e-aware lld) + tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg lsb-release software-properties-common zip
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19 lld-19 llvm-19
          clang-19 --version
          ld64.lld-19 --version || true
          ls /usr/lib/llvm-19/bin/ | grep -i -E "lld|lipo" || true

      - name: Fetch iOS SDK
        run: |
          set -e
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip
          ls sdks-master | head
          echo "SDK_ROOT=$PWD/sdks-master" >> $GITHUB_ENV

      - name: Compile arm64 + arm64e
        run: |
          set -e
          SDK="$SDK_ROOT/iPhoneOS15.6.sdk"
          [ -d "$SDK" ] || SDK=$(ls -d $SDK_ROOT/iPhoneOS*.sdk | tail -1)
          echo "SDK=$SDK"
          CLANG=/usr/lib/llvm-19/bin/clang
          LLD=/usr/lib/llvm-19/bin/ld64.lld
          ls -la $LLD || LLD=/usr/lib/llvm-19/bin/ld.lld
          mkdir -p out
          for ARCH in arm64 arm64e; do
            echo "=== $ARCH ==="
            EXTRA=""
            if [ "$ARCH" = "arm64e" ]; then
              EXTRA="-fptrauth-calls -fptrauth-returns -fptrauth-indirect-gotos -fptrauth-auth-traps -fptrauth-vtable-pointer-address-discrimination -fptrauth-vtable-pointer-type-discrimination"
            fi
            $CLANG -target ${ARCH}-apple-ios14.0 \
              -isysroot "$SDK" \
              -fuse-ld="$LLD" \
              -dynamiclib \
              -fobjc-arc -O2 -fblocks $EXTRA \
              -DNDEBUG \
              -framework Foundation -framework UIKit \
              -framework CoreGraphics -framework IOSurface \
              -framework ImageIO -framework QuartzCore \
              -install_name /Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib \
              -Wl,-platform_version,ios,14.0,15.6 \
              -Wl,-arch,$ARCH \
              -o out/DshScreenshotService.$ARCH.dylib \
              src/DshScreenshotService.m
            echo "$ARCH OK"
          done
          ls -la out/

      - name: Force arm64e cpusubtype + fat assemble
        run: |
          set -e
          A=out/DshScreenshotService.arm64.dylib
          E=out/DshScreenshotService.arm64e.dylib
          ls -la $A $E

          echo "--- before ---"
          echo -n "arm64  : "; od -An -tx4 -N 12 $A
          echo -n "arm64e : "; od -An -tx4 -N 12 $E

          # arm64e slice 的 cputype/subtype 在 offset 4..11
          CPU_E=$(od -An -tu4 -j4 -N4 $E | tr -d ' ')
          SUB_E=$(od -An -tu4 -j8 -N4 $E | tr -d ' ')
          echo "arm64e slice: cputype=$CPU_E subtype=$SUB_E"
          if [ "$CPU_E" != "16777228" ]; then
            echo "ERROR: arm64e slice cputype is not arm64 (0x0100000c)"; exit 1
          fi
          if [ "$SUB_E" != "2147483650" ]; then
            echo "rewriting subtype -> 0x80000002 (arm64e ptrauth ABI)"
            printf '\x02\x00\x00\x80' | dd of=$E bs=1 seek=8 conv=notrunc 2>/dev/null
          fi

          echo "--- after ---"
          echo -n "arm64e : "; od -An -tx4 -N 12 $E

          # 用 llvm-lipo 拼装（此时两 slice cputype 相同但 subtype 不同，lipo 应能区分）
          LIPO=/usr/lib/llvm-19/bin/llvm-lipo
          [ -x "$LIPO" ] || LIPO=/usr/bin/llvm-lipo
          echo "lipo: $LIPO"
          if $LIPO -create $A $E -output out/DshScreenshotService.dylib 2>lipo.err; then
            echo "llvm-lipo OK"
          else
            echo "llvm-lipo failed:"; cat lipo.err
            echo "=== fallback: node fat assembler ==="
            node -e '
              const fs=require("fs");
              const a=fs.readFileSync("out/DshScreenshotService.arm64.dylib");
              const e=fs.readFileSync("out/DshScreenshotService.arm64e.dylib");
              const AL=0x4000, pad=n=>(AL-(n%AL))%AL;
              const hdr=48;
              const offA=hdr+pad(hdr);
              const offE=offA+a.length+pad(a.length);
              const buf=Buffer.alloc(offE+e.length);
              buf.writeUInt32BE(0xcafebabe,0); buf.writeUInt32BE(2,4);
              buf.writeUInt32BE(0x0100000c,8);  buf.writeUInt32BE(0,12);
              buf.writeUInt32BE(offA,16);       buf.writeUInt32BE(a.length,20);
              buf.writeUInt32BE(14,24);
              buf.writeUInt32BE(0x0100000c,28); buf.writeUInt32BE(0x80000002,32);
              buf.writeUInt32BE(offE,36);       buf.writeUInt32BE(e.length,40);
              buf.writeUInt32BE(14,44);
              a.copy(buf,offA); e.copy(buf,offE);
              fs.writeFileSync("out/DshScreenshotService.dylib",buf);
              console.log("node fat:",buf.length,"bytes offA="+offA,"offE="+offE);
            '
          fi

          echo "=== final header ==="
          od -An -tx4 -N 52 out/DshScreenshotService.dylib
          ls -la out/DshScreenshotService.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: DshScreenshotService
          path: out/
          retention-days: 7
