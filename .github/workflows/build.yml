name: Build DshScreenshotService

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup iOS cross toolchain
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libplist-utils
          clang --version; ld64.lld --version 2>/dev/null || lld --version 2>/dev/null || true
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip
          ls sdks-master | head
          echo "SDK_ROOT=$PWD/sdks-master" >> $GITHUB_ENV

      - name: Fetch ldid
        run: |
          set -e
          git clone --depth=1 https://github.com/ProcursusTeam/ldid.git
          cd ldid
          make -j$(nproc) CXX=clang++ CC=clang || true
          ls -la ldid || sudo cp ldid /usr/local/bin/ 2>/dev/null || true
          cd ..
          if [ ! -x ./ldid/ldid ]; then
            echo "building ldid failed, downloading prebuilt"
            wget -q https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -O ldid_bin
            chmod +x ldid_bin
          fi
          ls -la

      - name: Show toolchain
        run: |
          clang --version
          ls $SDK_ROOT

      - name: Compile
        run: |
          set -e
          SDK="$SDK_ROOT/iPhoneOS15.6.sdk"
          if [ ! -d "$SDK" ]; then SDK=$(ls -d $SDK_ROOT/iPhoneOS*.sdk | tail -1); fi
          echo "USING SDK=$SDK"
          mkdir -p out
          for ARCH in arm64 arm64e; do
            echo "=== $ARCH ==="
            EXTRA=""
            if [ "$ARCH" = "arm64e" ]; then
              EXTRA="-fptrauth-calls -fptrauth-returns -fptrauth-indirect-gotos -fptrauth-auth-traps"
            fi
            clang -target ${ARCH}-apple-ios14.0 \
              -isysroot "$SDK" \
              -fuse-ld=lld \
              -dynamiclib \
              -fobjc-arc -O2 \
              -fblocks $EXTRA \
              -fno-constant-cfstrings \
              -DNDEBUG \
              -framework Foundation -framework UIKit \
              -framework CoreGraphics -framework IOSurface \
              -framework ImageIO -framework QuartzCore \
              -install_name /Library/MobileSubstrate/DynamicLibraries/DshScreenshotService.dylib \
              -o out/DshScreenshotService.$ARCH.dylib \
              src/DshScreenshotService.m || echo "FAILED $ARCH"
          done
          ls -la out/

      - name: Lipo
        run: |
          set -e
          LIPO=$(ls /usr/bin/llvm-lipo* /usr/lib/llvm-*/bin/llvm-lipo 2>/dev/null | head -1 || true)
          echo "lipo: ${LIPO:-none}"
          A64=out/DshScreenshotService.arm64.dylib
          A64E=out/DshScreenshotService.arm64e.dylib
          if [ -n "$LIPO" ] && [ -f "$A64" ] && [ -f "$A64E" ]; then
            $LIPO -create "$A64" "$A64E" -output out/DshScreenshotService.dylib && echo "fat ok"
          fi
          if [ ! -f out/DshScreenshotService.dylib ]; then
            # 关键：给 arm64 slice 打上 arm64e 兼容 subtype 0x80000000
            # 0x80000000 表示 arm64e 处理器可运行此 arm64 代码（无 PAC ABI 要求）
            cp "$A64" out/DshScreenshotService.dylib
            printf '\x00\x00\x00\x80' | dd of=out/DshScreenshotService.dylib bs=1 seek=8 conv=notrunc 2>/dev/null
            echo "fallback: arm64 thin + arm64e-compatible subtype"
            od -An -tx1 -N 12 out/DshScreenshotService.dylib
          fi
          file out/DshScreenshotService.dylib || true
          ls -la out/

      - name: Package
        run: |
          mkdir -p pkg/Library/MobileSubstrate/DynamicLibraries
          cp out/DshScreenshotService.dylib pkg/Library/MobileSubstrate/DynamicLibraries/
          cp src/DshScreenshotService.plist pkg/Library/MobileSubstrate/DynamicLibraries/
          cd pkg && zip -r ../DshScreenshotService.zip . && cd ..
          ls -la DshScreenshotService.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DshScreenshotService
          path: |
            out/
            DshScreenshotService.zip
          retention-days: 7
