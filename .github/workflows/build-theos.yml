name: Build with sbingner arm64e toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (老 libtinfo5)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip xz-utils curl libtinfo5 libncurses5 || true
          ls -la /lib/x86_64-linux-gnu/libtinfo.so.5* 2>/dev/null || echo "no libtinfo5"

      - name: Fetch arm64e toolchain
        run: |
          set -e
          curl -L -o tc.tar.lzma https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p $HOME/tc && tar xf tc.tar.lzma -C $HOME/tc
          ls $HOME/tc
          $HOME/tc/ios-arm64e-clang-toolchain/bin/clang --version 2>&1 | head -3

      - name: Fetch SDK
        run: |
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip

      - name: Compile arm64e
        run: |
          TC=$HOME/tc/ios-arm64e-clang-toolchain
          CLANG=$TC/bin/clang
          SDK="$PWD/sdks-master/iPhoneOS15.6.sdk"
          [ -d "$SDK" ] || SDK=$(ls -d $PWD/sdks-master/iPhoneOS*.sdk | tail -1)
          echo "SDK=$SDK"
          mkdir -p out
          for ARCH in arm64 arm64e; do
            echo "=== $ARCH ==="
            $CLANG -target ${ARCH}-apple-ios15.0 -isysroot "$SDK" \
              -dynamiclib -O2 -fblocks -DNDEBUG -framework Foundation \
              -install_name /Library/MobileSubstrate/DynamicLibraries/DshMin.dylib \
              -o out/DshMin.$ARCH.dylib src/probe/probe.m && echo "$ARCH OK" || echo "$ARCH FAILED"
          done
          ls -la out/
          for f in out/*.dylib; do echo "$f:"; od -An -tx4 -N 12 $f; done

      - uses: actions/upload-artifact@v4
        with:
          name: probe-tc
          path: out/
          retention-days: 7
          if-no-files-found: warn
