name: Build with sbingner arm64e toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip xz-utils curl libtinfo6 libncurses6
          # Ubuntu 24.04 没有 libtinfo.so.5，做兼容软链
          sudo mkdir -p /usr/lib/x86_64-linux-gnu
          for lib in libtinfo libncurses libncursesw; do
            for base in /lib/x86_64-linux-gnu /usr/lib/x86_64-linux-gnu; do
              [ -f "$base/$lib.so.6" ] && sudo ln -sf "$base/$lib.so.6" "$base/$lib.so.5"
            done
          done
          sudo ldconfig || true

      - name: Fetch arm64e toolchain
        run: |
          set -e
          URL=https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          curl -L -o tc.tar.lzma "$URL"
          ls -la tc.tar.lzma
          mkdir -p $HOME/tc
          tar xf tc.tar.lzma -C $HOME/tc
          echo "--- tree ---"
          ls $HOME/tc
          find $HOME/tc -maxdepth 3 -name 'clang*' -o -maxdepth 3 -name 'ld64*' | head -10

      - name: Fetch SDK
        run: |
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip

      - name: Compile arm64e
        run: |
          TC=$(ls -d $HOME/tc/*/ 2>/dev/null | head -1)
          [ -z "$TC" ] && TC=$HOME/tc
          echo "TC=$TC"
          ls $TC
          BIN=$TC/bin
          SDK="$PWD/sdks-master/iPhoneOS15.6.sdk"
          [ -d "$SDK" ] || SDK=$(ls -d $PWD/sdks-master/iPhoneOS*.sdk | tail -1)
          echo "SDK=$SDK"
          mkdir -p out
          CLANG=$BIN/clang
          $CLANG --version 2>&1 | head -3 || echo "clang missing"
          for ARCH in arm64 arm64e; do
            echo "=== $ARCH ==="
            $CLANG -target ${ARCH}-apple-ios15.0 \
              -isysroot "$SDK" \
              -dynamiclib -O2 -fblocks -DNDEBUG \
              -framework Foundation \
              -install_name /Library/MobileSubstrate/DynamicLibraries/DshMin.dylib \
              -o out/DshMin.$ARCH.dylib src/probe/probe.m && echo "$ARCH OK" || echo "$ARCH FAILED"
          done
          ls -la out/
          for f in out/*.dylib; do echo "$f:"; od -An -tx4 -N 12 $f; done

      - uses: actions/upload-artifact@v4
        with:
          name: probe-tc
          path: out/
          retention-days: 7
          if-no-files-found: warn
