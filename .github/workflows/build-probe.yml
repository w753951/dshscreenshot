name: Build probe

on:
  push:
    paths:
      - 'src/probe/**'
      - '.github/workflows/build-probe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 19
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg unzip
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19 lld-19 llvm-19

      - name: Fetch SDK
        run: |
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip
          echo "SDK_ROOT=$PWD/sdks-master" >> $GITHUB_ENV

      - name: Compile probe (arm64 + arm64e)
        run: |
          set -e
          SDK="$SDK_ROOT/iPhoneOS15.6.sdk"
          [ -d "$SDK" ] || SDK=$(ls -d $SDK_ROOT/iPhoneOS*.sdk | tail -1)
          mkdir -p out
          C=/usr/lib/llvm-19/bin/clang
          L=/usr/lib/llvm-19/bin/ld64.lld
          for ARCH in arm64 arm64e; do
            X=""
            [ "$ARCH" = "arm64e" ] && X="-fptrauth-calls -fptrauth-returns -fptrauth-indirect-gotos -fptrauth-auth-traps"
            $C -target ${ARCH}-apple-ios14.0 -isysroot "$SDK" -fuse-ld="$L" \
              -dynamiclib -O2 -fblocks $X -DNDEBUG \
              -framework Foundation -fobjc-arc \
              -Wl,-fixup_chains -Wl,-no_fixup_chains_auth \
              -Wl,-platform_version,ios,15.0,15.6 -Wl,-arch,$ARCH \
              -install_name /Library/MobileSubstrate/DynamicLibraries/DshMin.dylib \
              -o out/DshMin.$ARCH.dylib src/probe/probe.m
            echo "$ARCH ok"
          done
          ls -la out/
          E=out/DshMin.arm64e.dylib
          S=$(od -An -tu4 -j8 -N4 $E | tr -d ' ')
          [ "$S" != "2147483650" ] && printf '\x02\x00\x00\x80' | dd of=$E bs=1 seek=8 conv=notrunc 2>/dev/null
          od -An -tx4 -N 12 $E

      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/
          retention-days: 7
