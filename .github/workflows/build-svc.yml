name: Build svc (real arm64e)

on:
  workflow_dispatch:
  push:
    paths: ['src/svc/**', '.github/workflows/build-svc.yml']

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip xz-utils curl libtinfo5 libncurses5 || true
      - name: toolchain
        run: |
          set -e
          curl -L -o tc.tar.lzma https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p $HOME/tc && tar xf tc.tar.lzma -C $HOME/tc
          $HOME/tc/ios-arm64e-clang-toolchain/bin/clang --version | head -2
      - name: sdk
        run: |
          wget -q https://github.com/theos/sdks/archive/master.zip -O sdks.zip
          unzip -q sdks.zip
      - name: compile
        run: |
          set -e
          C=$HOME/tc/ios-arm64e-clang-toolchain/bin/clang
          SDK=$PWD/sdks-master/iPhoneOS13.7.sdk
          [ -d "$SDK" ] || SDK=$(ls -d $PWD/sdks-master/iPhoneOS*.sdk | sort -V | head -1)
          mkdir -p out
          for ARCH in arm64e arm64; do
            $C -target ${ARCH}-apple-ios15.0 -isysroot "$SDK" \
              -dynamiclib -O2 -fblocks -DNDEBUG \
              -install_name /Library/MobileSubstrate/DynamicLibraries/DshSvc.dylib \
              -o out/DshSvc.$ARCH.dylib src/svc/svc.m && echo "$ARCH OK" || echo "$ARCH FAILED"
          done
          ls -la out/
          for f in out/*.dylib; do echo "$f:"; od -An -tx4 -N 12 $f; done
      - uses: actions/upload-artifact@v4
        with:
          name: svc
          path: out/
          retention-days: 7
